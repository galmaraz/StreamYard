services:
  postgres:
    image: postgres:16-alpine
    container_name: weblive2026-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weblive2026}
      POSTGRES_USER: ${POSTGRES_USER:-weblive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weblive_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-weblive} -d ${POSTGRES_DB:-weblive2026}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
