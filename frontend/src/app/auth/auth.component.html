<main class="auth-page">
  <section class="panel">
    <p class="eyebrow">WebLive2026</p>
    <h1>{{ mode() === 'login' ? 'Iniciar sesion' : 'Crear cuenta host' }}</h1>
    <p class="summary">
      Entra al dashboard para crear salas, compartir invitaciones y conectar con
      Socket.IO en tiempo real.
    </p>

    <form (ngSubmit)="submit()" class="form">
      @if (mode() === 'register') {
        <label>
          Nombre visible
          <input
            name="displayName"
            [(ngModel)]="form.displayName"
            autocomplete="name"
            required
            minlength="2"
          />
        </label>
      }

      <label>
        Email
        <input
          name="email"
          type="email"
          [(ngModel)]="form.email"
          autocomplete="email"
          required
        />
      </label>

      <label>
        Password
        <input
          name="password"
          type="password"
          [(ngModel)]="form.password"
          autocomplete="current-password"
          required
          minlength="8"
        />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Procesando...' : 'Continuar' }}
      </button>
    </form>

    <div class="switcher">
      <button type="button" (click)="switchMode('login')" [class.active]="mode() === 'login'">
        Login
      </button>
      <button
        type="button"
        (click)="switchMode('register')"
        [class.active]="mode() === 'register'"
      >
        Registro
      </button>
    </div>
  </section>
</main>
